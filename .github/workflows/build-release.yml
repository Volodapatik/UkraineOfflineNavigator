name: Build APK & Create Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List output files
        run: find app/build/outputs -type f -name "*.apk" || echo "No APK found"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: UkraineNavigator-v0.1.0-mvp
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release + attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-mvp
          name: Ukraine Navigator MVP v0.1.0
          body: |
            ## Ukraine Offline Navigator — MVP v0.1.0

            ### Що працює:
            - MapLibre карта
            - GPS позиція + стрілка напрямку
            - 3 режими транспорту: Авто / Пішки / Велик
            - Тестова навігація (відстань + час)

            ### Як користуватись:
            1. Встанови APK
            2. Дай дозвіл на геолокацію
            3. **Довге натискання** на карті = точка призначення
            4. Внизу з’явиться панель з відстанню і часом

            > Debug-збірка. Повна офлайн-маршрутизація ще в розробці.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
