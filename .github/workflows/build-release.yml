name: Build APK & Create Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: List APK files
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UkraineNavigator-v0.1.0-mvp
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-mvp
          name: Ukraine Navigator MVP v0.1.0
          body: |
            ## Ukraine Offline Navigator — MVP v0.1.0

            ### Що працює:
            - MapLibre карта
            - GPS позиція + стрілка напрямку
            - 3 режими транспорту: Авто / Пішки / Велик
            - Тестова навігація (відстань + час, що залишився)

            ### Як користуватись:
            1. Встанови APK
            2. Дай дозвіл на геолокацію
            3. **Довге натискання** на карті = точка призначення
            4. Внизу з’явиться панель з відстанню і часом

            > Це debug-збірка. Повна офлайн-маршрутизація і карти України ще в розробці.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
